<style>
  :root {
    --green: #2f9619; --green-light: #49b52a; --green-dark: #1d6a0c; --green-deep: #0f3a07;
    --bg: #f1f9ee; --soft: #e6f3e0; --line: #cfe6c8; --ink: #14301a; --muted: #5f7a60;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(180deg, #def1d5 0, var(--bg) 240px) no-repeat, var(--bg);
    color: var(--ink);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 420px; }

  .brand { display: flex; align-items: center; gap: 14px; margin: 6px 0 6px; }
  .logo { width: 62px; height: auto; display: block; filter: drop-shadow(0 4px 6px rgba(15, 58, 7, .25)); }
  .name {
    font-weight: 900; font-size: 34px; line-height: 1; letter-spacing: -.5px;
    background: linear-gradient(180deg, var(--green-light) 0%, var(--green) 50%, var(--green-dark) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-weight: 800; font-size: 13px; letter-spacing: .38em; color: #111; margin-top: 5px; padding-left: 2px; }
  .pill {
    display: inline-block; margin: 14px 0 14px; padding: 5px 14px; border-radius: 999px;
    background: var(--soft); border: 1px solid var(--line); color: var(--green-dark);
    font-weight: 800; font-size: 13px; letter-spacing: .12em;
  }

  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 20px;
    box-shadow: 0 8px 24px rgba(31, 106, 12, .10);
  }
  .row { display: flex; align-items: center; gap: 12px; }
  .otp {
    flex: 1; min-width: 0; overflow: hidden; white-space: nowrap;
    font-weight: 900; font-size: 42px; letter-spacing: 6px; font-variant-numeric: tabular-nums;
    color: #b9cfb4;
  }
  .otp.live { color: var(--ink); }
  button {
    font: inherit; font-weight: 800; border: 0; border-radius: 14px; cursor: pointer;
    color: #fff; padding: 14px 20px;
    background: linear-gradient(180deg, #4cb82c 0%, var(--green) 55%, #237a10 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 3px 8px rgba(31,106,12,.32);
  }
  button:active { transform: translateY(1px); }
  button:disabled { background: #e1ebde; color: #8aa088; box-shadow: none; cursor: default; }
  button.wide { width: 100%; margin-top: 12px; }
  button.sec { background: var(--soft); color: var(--green-dark); border: 1px solid var(--line); box-shadow: none; }
  #status { margin-top: 14px; font-size: 14px; font-weight: 700; color: var(--muted); }
  input {
    width: 100%; font: inherit; font-size: 18px; font-weight: 700; padding: 14px; border-radius: 14px;
    border: 1.5px solid var(--line); background: #fbfefa; color: var(--ink); margin-top: 8px;
  }
  input:focus { outline: 2px solid var(--green-light); outline-offset: 1px; }
  p { line-height: 1.5; margin: 0 0 8px; }
  .small { font-size: 13px; color: var(--muted); margin-top: 14px; }
  #msg { color: #b3261e; margin-top: 12px; min-height: 20px; font-size: 14px; font-weight: 700; }
  [hidden] { display: none !important; }
</style>
</head>

<script src="/config.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getMessaging, getToken, onMessage } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js';

const $ = (id) => document.getElementById(id);
const TTL = 5 * 60 * 1000;
const K_OTP = 'sss_otp', K_REG = 'sss_registered', K_TOK = 'sss_token';
let messaging = null;

/* ---------- OTP storage (sa device lang, may expiry) ---------- */
function save(code, ts) {
  try { localStorage.setItem(K_OTP, JSON.stringify({ code: String(code), ts: Number(ts) || Date.now() })); } catch (e) {}
}
function load() {
  try { return JSON.parse(localStorage.getItem(K_OTP) || 'null'); } catch (e) { return null; }
}
function clearOtp() { try { localStorage.removeItem(K_OTP); } catch (e) {} }

function render() {
  const o = load();
  const left = o ? o.ts + TTL - Date.now() : 0;
  if (o && left > 0) {
    $('otp').textContent = o.code;
    $('otp').classList.add('live');
    $('copy').disabled = false;
    const s = Math.ceil(left / 1000);
    $('status').textContent = 'Valid pa ng ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  } else {
    if (o) clearOtp();
    $('otp').textContent = '------';
    $('otp').classList.remove('live');
    $('copy').disabled = true;
    $('status').textContent = 'Naghihintay ng OTP...';
  }
}

function acceptOtp(code, ts) {
  if (!/^\d{6}$/.test(String(code || ''))) return;
  const cur = load();
  if (!cur || Number(ts) >= cur.ts) save(code, ts);
  render();
}

/* ---------- Kunin ang OTP mula sa URL o sa mga nakabinbing notification ---------- */
function fromUrl() {
  const p = new URLSearchParams(location.search);
  if (p.get('otp')) {
    acceptOtp(p.get('otp'), p.get('ts'));
    history.replaceState(null, '', '/');
  }
}
async function fromNotifications() {
  try {
    const reg = await navigator.serviceWorker.getRegistration('/');
    if (!reg) return;
    const list = await reg.getNotifications({ tag: 'sss-otp' });
    list.forEach((n) => {
      const d = n.data || {};
      if (d.otp) acceptOtp(d.otp, d.ts);
      if (Date.now() - Number(d.ts || 0) > TTL) n.close();
    });
  } catch (e) {}
}

/* ---------- Copy ---------- */
$('copy').addEventListener('click', async () => {
  const o = load();
  if (!o) return;
  let ok = false;
  try { await navigator.clipboard.writeText(o.code); ok = true; } catch (e) {}
  if (!ok) {
    try {
      const t = document.createElement('textarea');
      t.value = o.code; document.body.appendChild(t); t.select();
      ok = document.execCommand('copy'); t.remove();
    } catch (e) {}
  }
  $('copy').textContent = ok ? 'Na-copy ✓' : 'Hindi na-copy';
  setTimeout(() => { $('copy').textContent = 'Copy'; }, 1500);
});

/* ---------- Firebase messaging ---------- */
async function initMessaging() {
  const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
  await navigator.serviceWorker.ready;
  if (!messaging) {
    messaging = getMessaging(initializeApp(self.FIREBASE_CONFIG));
    onMessage(messaging, (p) => { const d = p.data || {}; acceptOtp(d.otp, d.ts); });
  }
  return reg;
}
function getTok(reg) {
  return getToken(messaging, { vapidKey: self.VAPID_KEY, serviceWorkerRegistration: reg });
}

navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'otp') acceptOtp(e.data.otp, e.data.ts);
});

/* ---------- Screens ---------- */
function show(which) { $('setup').hidden = which !== 'setup'; $('main').hidden = which !== 'main'; }
function say(t) { $('msg').textContent = t || ''; }

$('enable').addEventListener('click', async () => {
  const pin = $('pin').value.trim();
  if (!pin) return say('Ilagay ang PIN.');
  if (!('serviceWorker' in navigator) || !('Notification' in window)) {
    return say('Hindi supported ng browser na ito. Gamitin ang Chrome, o i-add sa Home Screen (iPhone).');
  }
  $('enable').disabled = true; say('Sandali lang...');
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error('Kailangan i-allow ang notifications.');
    const reg = await initMessaging();
    const token = await getTok(reg);
    if (!token) throw new Error('Walang nakuhang token. Subukan ulit.');
    const r = await fetch('/.netlify/functions/register', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pin, token })
    });
    if (r.status === 401) throw new Error('Maling PIN.');
    if (!r.ok) throw new Error('May error sa server. Subukan ulit mamaya.');
    localStorage.setItem(K_REG, '1');
    localStorage.setItem(K_TOK, token);
    $('pin').value = '';
    say(''); show('main');
  } catch (e) {
    say(e.message || 'May error.');
  }
  $('enable').disabled = false;
});

/* ---------- Boot ---------- */
async function boot() {
  fromUrl();
  render();
  setInterval(render, 1000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) fromNotifications().then(render);
  });

  const ready = localStorage.getItem(K_REG) === '1' &&
    'Notification' in window && Notification.permission === 'granted' &&
    'serviceWorker' in navigator;
  if (!ready) { show('setup'); return; }

  show('main');
  try {
    const reg = await initMessaging();
    const token = await getTok(reg);
    // Kung nagbago ang token, kailangan i-register ulit gamit ang PIN.
    if (token && token !== localStorage.getItem(K_TOK)) {
      localStorage.removeItem(K_REG);
      show('setup');
      say('Kailangan i-register ulit ang device. Ilagay ang PIN.');
    }
  } catch (e) {}
  await fromNotifications();
  render();
}
boot();
</script>
